[OUTPUT]
    Name                  opentelemetry
    Match                 k8s.*
    Host                  ${OTEL_EXPORTER_HOST}
    Port                  ${OTEL_EXPORTER_PORT}
    Logs_uri              /v1/logs
    # Local in-pod hop to the edge collector — plaintext, no TLS.
    Tls                   Off
    # The parsed log line becomes the OTLP log record body; every other
    # record key (namespace, pod_name, service, ...) is emitted as a log
    # record attribute. Downstream the receiving collector can stamp
    # additional resource labels before forwarding to the logs backend.
    logs_body_key         $message
    Log_response_payload  Off
